<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Treino Nashville</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Treino Nashville</h1>
    <div class="top-actions">
      <button id="micBtn" class="pill-btn mic-btn" aria-pressed="false" aria-label="Microfone">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        <span class="mic-label">Mic</span>
      </button>
      <button id="keyBtn" class="pill-btn key-btn" aria-haspopup="dialog" aria-controls="drawer">
        Tom: <strong id="keyLabel">C</strong>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="bar-info" id="barInfo">Pronto</div>

    <div class="card">
      <div class="number" id="number">–</div>
      <div class="note" id="note">&nbsp;</div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>
    <div class="score" id="score" hidden></div>

    <div class="beats" id="beats" aria-hidden="true">
      <!-- 4 compassos x 4 tempos -->
    </div>

    <div class="controls">
      <button id="startBtn" class="start-btn">Iniciar</button>
    </div>
    <label class="bpm">
      <span class="bpm-label"><strong id="bpmValue">90</strong> BPM</span>
      <input type="range" id="bpmSlider" min="40" max="200" step="1" value="90" aria-label="Andamento em BPM" />
    </label>
    <p class="hint">4 compassos por nota · número no 1º compasso, acorde no 3º<br />Com o Mic ligado: toque a nota no 2º compasso e veja o resultado no 4º</p>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle">Escolher tom</h2>
      <button id="closeDrawer" class="close-btn" aria-label="Fechar">×</button>
    </div>
    <div class="key-grid" id="keyGrid"></div>
    <div class="scale-preview">
      <span class="label">Escala</span>
      <div id="scalePreview"></div>
    </div>
  </aside>

  <script src="pitch.js"></script>
  <script src="app.js"></script>
</body>
</html>
